[env:lilygo-t7-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; USB CDC for serial monitor on ESP32-S3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0

; TFT_eSPI build flags for ST7735S 128x160
build_unflags = -Os
extra_scripts = pre:tft_setup.py
